<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d592;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#009e6e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" />
  <!-- Background circles -->
  <circle cx="700" cy="80" r="130" fill="white" fill-opacity="0.08" />
  <circle cx="90" cy="380" r="100" fill="white" fill-opacity="0.08" />
  <!-- Ninja silhouette (simplified) -->
  <g transform="translate(310, 80)">
    <!-- body -->
    <ellipse cx="90" cy="160" rx="42" ry="60" fill="white" fill-opacity="0.85" />
    <!-- head -->
    <circle cx="90" cy="80" r="36" fill="white" fill-opacity="0.85" />
    <!-- mask band -->
    <rect x="58" y="70" width="64" height="18" rx="4" fill="#009e6e" />
    <!-- eyes -->
    <circle cx="78" cy="79" r="5" fill="white" />
    <circle cx="102" cy="79" r="5" fill="white" />
    <!-- arms -->
    <rect x="24" y="120" width="30" height="10" rx="5" fill="white" fill-opacity="0.85" transform="rotate(-20 24 125)" />
    <rect x="118" y="120" width="30" height="10" rx="5" fill="white" fill-opacity="0.85" transform="rotate(20 148 125)" />
    <!-- legs -->
    <rect x="62" y="210" width="20" height="50" rx="8" fill="white" fill-opacity="0.85" />
    <rect x="90" y="210" width="20" height="50" rx="8" fill="white" fill-opacity="0.85" transform="rotate(10 100 235)" />
    <!-- sword -->
    <rect x="148" y="90" width="70" height="6" rx="3" fill="#fdc700" fill-opacity="0.95" transform="rotate(-30 148 93)" />
  </g>
  <!-- Medical cross / health icons -->
  <rect x="160" y="160" width="30" height="10" rx="3" fill="white" fill-opacity="0.7" />
  <rect x="170" y="150" width="10" height="30" rx="3" fill="white" fill-opacity="0.7" />
  <rect x="600" y="200" width="24" height="8" rx="3" fill="white" fill-opacity="0.5" />
  <rect x="608" y="192" width="8" height="24" rx="3" fill="white" fill-opacity="0.5" />
  <!-- Stars (achievement) -->
  <text x="130" y="250" font-size="28" fill="#fdc700" fill-opacity="0.8">★</text>
  <text x="620" y="150" font-size="22" fill="#fdc700" fill-opacity="0.7">★</text>
  <!-- Label -->
  <text x="400" y="375" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="700" fill="white" letter-spacing="1">Ninja-Style Instructive Game</text>
  <text x="400" y="405" text-anchor="middle" font-family="sans-serif" font-size="14" fill="white" fill-opacity="0.75" letter-spacing="2">EDUCATIONAL GAME · MEDICAL</text>
</svg>

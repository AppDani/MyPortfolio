<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2b7fff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1060cc;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" />
  <!-- Background circles -->
  <circle cx="720" cy="60" r="110" fill="white" fill-opacity="0.07" />
  <circle cx="80" cy="400" r="90" fill="white" fill-opacity="0.07" />
  <!-- Moodle-style course UI mockup -->
  <rect x="100" y="80" width="600" height="270" rx="12" fill="white" fill-opacity="0.12" />
  <!-- Course header bar -->
  <rect x="100" y="80" width="600" height="48" rx="12" fill="white" fill-opacity="0.2" />
  <circle cx="130" cy="104" r="12" fill="#fdc700" fill-opacity="0.9" />
  <rect x="152" y="97" width="140" height="14" rx="4" fill="white" fill-opacity="0.8" />
  <!-- Chat bubble left (bot) -->
  <rect x="130" y="148" width="220" height="56" rx="12" fill="white" fill-opacity="0.22" />
  <circle cx="130" cy="148" r="16" fill="#8ec5ff" fill-opacity="0.9" />
  <text x="130" y="154" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1060cc">🤖</text>
  <rect x="148" y="163" width="160" height="10" rx="4" fill="white" fill-opacity="0.7" />
  <rect x="148" y="182" width="120" height="10" rx="4" fill="white" fill-opacity="0.5" />
  <!-- Chat bubble right (user) -->
  <rect x="450" y="220" width="220" height="44" rx="12" fill="#8ec5ff" fill-opacity="0.3" />
  <rect x="460" y="235" width="150" height="10" rx="4" fill="white" fill-opacity="0.7" />
  <rect x="460" y="252" width="100" height="10" rx="4" fill="white" fill-opacity="0.5" />
  <!-- Module cards -->
  <rect x="130" y="295" width="155" height="40" rx="8" fill="white" fill-opacity="0.18" />
  <rect x="300" y="295" width="155" height="40" rx="8" fill="white" fill-opacity="0.18" />
  <rect x="470" y="295" width="155" height="40" rx="8" fill="white" fill-opacity="0.18" />
  <rect x="140" y="308" width="100" height="10" rx="4" fill="white" fill-opacity="0.6" />
  <rect x="310" y="308" width="100" height="10" rx="4" fill="white" fill-opacity="0.6" />
  <rect x="480" y="308" width="100" height="10" rx="4" fill="white" fill-opacity="0.6" />
  <!-- Label -->
  <text x="400" y="385" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="700" fill="white" letter-spacing="0.5">Mini Course: Chatbots for Learning</text>
  <text x="400" y="415" text-anchor="middle" font-family="sans-serif" font-size="14" fill="white" fill-opacity="0.75" letter-spacing="2">INSTRUCTIONAL DESIGN</text>
</svg>
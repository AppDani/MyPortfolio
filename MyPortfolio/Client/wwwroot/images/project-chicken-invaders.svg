<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6900;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc5300;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" />
  <!-- Scanline effect -->
  <rect width="800" height="450" fill="black" fill-opacity="0.05" />
  <!-- Pixel grid decoration -->
  <rect x="0" y="0" width="800" height="450" fill="url(#bg)" />
  <!-- Retro ground line -->
  <rect x="0" y="380" width="800" height="4" fill="white" fill-opacity="0.3" />
  <!-- Chicken silhouettes (simple pixel-art style) -->
  <!-- Chicken 1 -->
  <g transform="translate(120, 120)">
    <ellipse cx="0" cy="0" rx="28" ry="22" fill="white" fill-opacity="0.9" />
    <circle cx="0" cy="-30" r="16" fill="white" fill-opacity="0.9" />
    <polygon points="0,-46 -8,-38 8,-38" fill="#fdc700" />
    <circle cx="-5" cy="-32" r="3" fill="#1a0a00" />
    <rect x="-10" y="18" width="8" height="14" rx="2" fill="#fdc700" />
    <rect x="4" y="18" width="8" height="14" rx="2" fill="#fdc700" />
  </g>
  <!-- Chicken 2 -->
  <g transform="translate(400, 100)">
    <ellipse cx="0" cy="0" rx="28" ry="22" fill="white" fill-opacity="0.9" />
    <circle cx="0" cy="-30" r="16" fill="white" fill-opacity="0.9" />
    <polygon points="0,-46 -8,-38 8,-38" fill="#fdc700" />
    <circle cx="-5" cy="-32" r="3" fill="#1a0a00" />
    <rect x="-10" y="18" width="8" height="14" rx="2" fill="#fdc700" />
    <rect x="4" y="18" width="8" height="14" rx="2" fill="#fdc700" />
  </g>
  <!-- Chicken 3 -->
  <g transform="translate(660, 120)">
    <ellipse cx="0" cy="0" rx="28" ry="22" fill="white" fill-opacity="0.9" />
    <circle cx="0" cy="-30" r="16" fill="white" fill-opacity="0.9" />
    <polygon points="0,-46 -8,-38 8,-38" fill="#fdc700" />
    <circle cx="-5" cy="-32" r="3" fill="#1a0a00" />
    <rect x="-10" y="18" width="8" height="14" rx="2" fill="#fdc700" />
    <rect x="4" y="18" width="8" height="14" rx="2" fill="#fdc700" />
  </g>
  <!-- Laser beams -->
  <rect x="119" y="160" width="3" height="60" fill="#fdc700" fill-opacity="0.8" />
  <rect x="399" y="140" width="3" height="80" fill="#fdc700" fill-opacity="0.8" />
  <!-- Player ship -->
  <g transform="translate(400, 330)">
    <polygon points="0,-30 -30,20 30,20" fill="white" fill-opacity="0.95" />
    <rect x="-5" y="-10" width="10" height="20" fill="#ff6900" />
    <circle cx="0" cy="-35" r="5" fill="#fdc700" fill-opacity="0.9" />
  </g>
  <!-- Score display -->
  <text x="80" y="50" font-family="monospace" font-size="14" fill="white" fill-opacity="0.7">SCORE: 9800</text>
  <text x="650" y="50" font-family="monospace" font-size="14" fill="white" fill-opacity="0.7">LIVES: ♥♥♥</text>
  <!-- Label -->
  <text x="400" y="415" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="700" fill="white" letter-spacing="1">Chicken Invaders</text>
  <text x="400" y="440" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" fill-opacity="0.75" letter-spacing="2">GAME DEVELOPMENT</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c27aff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9150d4;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.18" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="#1a0533" />
  <rect width="800" height="450" fill="url(#bg)" fill-opacity="0.75" />
  <!-- Stars -->
  <circle cx="80" cy="60" r="2" fill="white" fill-opacity="0.8" />
  <circle cx="200" cy="30" r="1.5" fill="white" fill-opacity="0.6" />
  <circle cx="350" cy="50" r="2.5" fill="white" fill-opacity="0.9" />
  <circle cx="500" cy="20" r="1.5" fill="white" fill-opacity="0.7" />
  <circle cx="650" cy="45" r="2" fill="white" fill-opacity="0.8" />
  <circle cx="730" cy="25" r="1.5" fill="white" fill-opacity="0.6" />
  <circle cx="140" cy="400" r="1.5" fill="white" fill-opacity="0.5" />
  <circle cx="600" cy="410" r="2" fill="white" fill-opacity="0.7" />
  <circle cx="760" cy="380" r="1.5" fill="white" fill-opacity="0.6" />
  <!-- Planet -->
  <circle cx="630" cy="120" r="70" fill="#dab2ff" fill-opacity="0.25" />
  <circle cx="630" cy="120" r="55" fill="#dab2ff" fill-opacity="0.15" />
  <!-- Orbit ring -->
  <ellipse cx="630" cy="120" rx="100" ry="22" fill="none" stroke="white" stroke-opacity="0.2" stroke-width="2" />
  <!-- Rocket -->
  <g transform="translate(330, 120) rotate(-30)">
    <ellipse cx="40" cy="0" rx="18" ry="50" fill="white" fill-opacity="0.9" />
    <polygon points="40,-50 20,-20 60,-20" fill="#c27aff" />
    <rect x="14" y="20" width="12" height="20" rx="4" fill="#9150d4" fill-opacity="0.8" />
    <rect x="54" y="20" width="12" height="20" rx="4" fill="#9150d4" fill-opacity="0.8" />
    <ellipse cx="40" cy="44" rx="14" ry="8" fill="#fdc700" fill-opacity="0.9" />
  </g>
  <!-- Label -->
  <text x="400" y="360" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="700" fill="white" letter-spacing="1">Space Mission</text>
  <text x="400" y="390" text-anchor="middle" font-family="sans-serif" font-size="14" fill="white" fill-opacity="0.75" letter-spacing="2">EDUCATIONAL GAME</text>
</svg>
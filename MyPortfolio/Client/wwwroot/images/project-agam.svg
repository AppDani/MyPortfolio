<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fb64b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c73d90;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="circle1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" />
  <!-- Decorative circles -->
  <circle cx="680" cy="80" r="120" fill="url(#circle1)" />
  <circle cx="100" cy="380" r="90" fill="url(#circle1)" />
  <circle cx="720" cy="350" r="60" fill="white" fill-opacity="0.08" />
  <!-- Grid lines suggesting a portfolio layout -->
  <rect x="160" y="140" width="480" height="170" rx="12" fill="white" fill-opacity="0.12" />
  <rect x="180" y="160" width="140" height="90" rx="8" fill="white" fill-opacity="0.18" />
  <rect x="340" y="160" width="140" height="90" rx="8" fill="white" fill-opacity="0.18" />
  <rect x="500" y="160" width="120" height="90" rx="8" fill="white" fill-opacity="0.18" />
  <rect x="180" y="265" width="440" height="28" rx="6" fill="white" fill-opacity="0.1" />
  <!-- Icon -->
  <circle cx="400" cy="80" r="36" fill="white" fill-opacity="0.2" />
  <text x="400" y="89" text-anchor="middle" font-family="sans-serif" font-size="28" fill="white">✦</text>
  <!-- Label -->
  <text x="400" y="355" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="700" fill="white" letter-spacing="1">Yaacov Agam Portfolio</text>
  <text x="400" y="385" text-anchor="middle" font-family="sans-serif" font-size="14" fill="white" fill-opacity="0.75" letter-spacing="2">UX DESIGN</text>
</svg>